services:
  api:
    build: ./backend
    environment:
      ZHUATECH_PEOPLE_DETECT_PROVIDER: ${ZHUATECH_PEOPLE_DETECT_PROVIDER:-local}
      ZHUATECH_PEOPLE_DETECT_BASE_URL: ${ZHUATECH_PEOPLE_DETECT_BASE_URL:-}
      ZHUATECH_PEOPLE_DETECT_MODEL: ${ZHUATECH_PEOPLE_DETECT_MODEL:-object-detection-provider-model}
      ZHUATECH_PEOPLE_DETECT_API_KEY: ${ZHUATECH_PEOPLE_DETECT_API_KEY:-}
    ports: ["8080:8080"]
  web:
    image: nginx:1.27-alpine
    volumes: ["./frontend:/usr/share/nginx/html:ro"]
    ports: ["8088:80"]
